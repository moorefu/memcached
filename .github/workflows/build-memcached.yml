name: Build memcached

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      make_latest:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
    outputs:
      release_version:
        description: "The version of memcached being built"
        value: ${{ jobs.prepare.outputs.release_version }}

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.6.29)'
        required: true
        type: string
      make_latest:
        description: 'Mark as latest release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.setup.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        run: |
          VERSION="${{ inputs.release_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git archive -o memcached-$VERSION.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: memcached-source
          path: memcached-${{ inputs.release_version }}.tar.gz

  build-linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux container
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"

          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash scripts/build-linux-portable.sh "$VERSION"

      - name: Verify
        run: docker run --rm -v "$(pwd)":/workspace -w /workspace ${{ matrix.image }} ./memcached --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memcached-linux-${{ matrix.arch }}
          path: |
            memcached-*-linux-glibc2.17-${{ matrix.arch }}.tar.gz
            memcached-*-linux-glibc2.17-${{ matrix.arch }}.tar.gz.sha256

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MSYS 工具链(完整 POSIX 运行时), 非 mingw64: memcached 源码是纯 Unix 代码,
      # mingw64 缺少 sys/socket.h 等头文件需要大改(参考 jefyt/memcached-windows 的
      # 原生移植, 其代价是不支持 SASL)。MSYS 方案源码零改动、SASL/TLS 全可用,
      # 代价是 zip 内附带 msys-2.0.dll 等运行时 DLL。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            autoconf
            automake
            libtool
            gperf
            perl
            python
            zip
            libevent
            libevent-devel
            libopenssl
            openssl-devel
            libsasl
            libsasl-devel

      - name: Build memcached
        shell: msys2 {0}
        run: |
          set -e
          VERSION="${{ needs.prepare.outputs.release_version }}"
          echo "m4_define([VERSION_NUMBER], [$VERSION])" > version.m4
          ./autogen.sh

          # Overwrite version.m4 after autogen.sh (perl version.pl uses git describe)
          echo "m4_define([VERSION_NUMBER], [$VERSION])" > version.m4
          ./configure \
            --enable-tls \
            --enable-sasl \
            --enable-sasl-pwdb
          make -j$(nproc)

      - name: Verify
        shell: msys2 {0}
        run: |
          set -e
          ./memcached --version

          # SASL PLAIN 功能测试
          printf 'testuser:testpass\n' > /tmp/pwdb
          MEMCACHED_SASL_PWDB=/tmp/pwdb ./memcached -S -p 11311 -U 0 -m 64 -v > /tmp/mc.log 2>&1 &
          MC=$!
          sleep 2
          python - <<'PYEOF'
          import socket, struct, sys

          HOST, PORT = '127.0.0.1', 11311

          def send_pkt(s, opcode, key=b'', val=b''):
              total = len(key) + len(val)
              hdr = struct.pack('!BBHBBHIIQ', 0x80, opcode, len(key), 0, 0, 0, total, 0, 0)
              s.sendall(hdr + key + val)

          def recv_pkt(s):
              hdr = b''
              while len(hdr) < 24:
                  c = s.recv(24 - len(hdr))
                  if not c: raise IOError('connection closed')
                  hdr += c
              magic, op, keyl, extl, dtype, status, rest, opaque, cas = struct.unpack('!BBHBBHIIQ', hdr)
              body = b''
              while len(body) < rest:
                  c = s.recv(rest - len(body))
                  if not c: raise IOError('connection closed')
                  body += c
              return status, body

          s = socket.create_connection((HOST, PORT), 5)
          send_pkt(s, 0x20)
          status, body = recv_pkt(s)
          if status != 0 or b'PLAIN' not in body.split():
              sys.exit('FAIL: PLAIN mechanism missing')
          s.close()

          s = socket.create_connection((HOST, PORT), 5)
          send_pkt(s, 0x21, b'PLAIN', b'\x00testuser\x00testpass')
          status, body = recv_pkt(s)
          if status != 0:
              sys.exit('FAIL: PLAIN auth failed with correct password')
          s.close()

          s = socket.create_connection((HOST, PORT), 5)
          send_pkt(s, 0x21, b'PLAIN', b'\x00testuser\x00wrongpass')
          status, body = recv_pkt(s)
          if status == 0:
              sys.exit('FAIL: wrong password was accepted')
          s.close()
          print('SASL PLAIN: all tests passed')
          PYEOF
          kill $MC 2>/dev/null || true

      - name: Package
        shell: msys2 {0}
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"
          DIST="memcached-$VERSION-windows-x86_64-msys2"
          rm -rf "$DIST"
          mkdir -p "$DIST/bin" "$DIST/include" "$DIST/share/doc" "$DIST/share/sasl2"
          cp memcached.exe "$DIST/bin/"
          # 打包 msys 运行时依赖 DLL 到 bin/ (exe 同目录自动加载), 解压即用
          for dll in $(ldd memcached.exe | grep -oE '/usr/bin/[^ ]+\.dll' | sort -u); do
            cp "$dll" "$DIST/bin/"
          done
          # SASL 机制插件(可选; PLAIN 已内置于 msys libsasl2)
          cp /usr/lib/sasl2/*.dll "$DIST/share/sasl2/" 2>/dev/null || true
          cp COPYING "$DIST/share/doc/LICENSE"
          cat > "$DIST/share/doc/README.txt" <<EOF
          memcached $VERSION Windows 版 (x86_64, MSYS2 运行时)

          标准前缀布局 (bin/include/share), 自带运行所需全部 DLL
          (msys-2.0.dll 等位于 bin/), 解压即可运行, 无需安装 MSYS2。

          用法:
            bin/memcached.exe -p 11211 -m 64

          SASL 认证 (-S):
            echo testuser:testpass > pwdb.txt
            MEMCACHED_SASL_PWDB=pwdb.txt bin/memcached.exe -S
            (内置 PLAIN 机制; 如需 SCRAM/GSSAPI 等机制, 设置环境变量
             SASL_PATH 指向本包 share/sasl2 目录)

          TLS: 完整支持 (openssl 3.x 随包提供)。

          注意: 本构建基于 MSYS2 POSIX 兼容运行时, 性能低于原生 Linux 构建,
          适合开发/测试/轻量场景; 生产环境建议使用 Linux 构建。

          目录结构:
            bin/     memcached.exe 主程序 + msys 运行时 DLL
            include/ 占位 (memcached 无对外 API 头文件)
            share/   文档(doc), SASL 机制插件(sasl2, 可选)
          EOF
          zip -q -r "$DIST.zip" "$DIST"
          sha256sum "$DIST.zip" > "$DIST.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memcached-windows-x86_64
          path: |
            memcached-*-windows-x86_64-msys2.zip
            memcached-*-windows-x86_64-msys2.zip.sha256

  release:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: memcached ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          make_latest: "${{ inputs.make_latest }}"
          prerelease: ${{ inputs.prerelease }}
          files: |
            memcached-linux-x86_64/memcached-${{ env.VERSION }}-linux-glibc2.17-x86_64.tar.gz
            memcached-linux-x86_64/memcached-${{ env.VERSION }}-linux-glibc2.17-x86_64.tar.gz.sha256
            memcached-linux-aarch64/memcached-${{ env.VERSION }}-linux-glibc2.17-aarch64.tar.gz
            memcached-linux-aarch64/memcached-${{ env.VERSION }}-linux-glibc2.17-aarch64.tar.gz.sha256
            memcached-windows-x86_64/memcached-${{ env.VERSION }}-windows-x86_64-msys2.zip
            memcached-windows-x86_64/memcached-${{ env.VERSION }}-windows-x86_64-msys2.zip.sha256
